# Mosquitto configuration for E2E testing
# Allow anonymous connections for testing
allow_anonymous true

# Listeners
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence false

# Security (disabled for E2E testing)
# password_file /mosquitto/config/passwd 