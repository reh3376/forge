repos:
- hooks:
  - id: commitizen
  - id: commitizen-branch
    stages:
    - push
  repo: https://github.com/commitizen-tools/commitizen
  rev: v3.25.0
- repo: https://github.com/gitguardian/ggshield
  rev: v1.27.0
  hooks:
    - id: ggshield
      language_version: python3
      stages: [ commit ]
