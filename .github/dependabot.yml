version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/modules/Forge MES"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      mes-minor-patch:
        update-types: ["minor", "patch"]
