version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      github-actions:
        patterns: ["*"]
  # uv, not pip: the pip ecosystem edits pyproject.toml alone and every such PR fails the
  # `uv sync --locked` gate (FB-096); uv bumps pyproject.toml and uv.lock together (FB-102).
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule: { interval: "weekly" }
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/modules/Forge MES"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      mes-minor-patch:
        update-types: ["minor", "patch"]
