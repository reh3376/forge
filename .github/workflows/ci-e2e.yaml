name: E2E CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Install dependencies
        run: npm install
        working-directory: ./apps/whk-recipe-configuration

      - name: Decrypt the .env file from dotenv-vault
        run: npx dotenv-vault@latest decrypt ${DOTENV_KEY} > .env
        working-directory: ./apps/whk-recipe-configuration
        env:
          DOTENV_KEY: ${{ secrets.DOTENV_KEY_CI }}

      - name: Display .env contents
        run: cat .env
        working-directory: ./apps/whk-recipe-configuration

      - name: List configuration directory contents
        run: ls -la ./apps/whk-recipe-configuration

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.17.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Verify Docker Compose Installation
        run: docker-compose --version

      - name: Add user to docker group
        run: |
          sudo usermod -aG docker $USER

      - name: Build Docker images
        run: sudo docker-compose build
        working-directory: ./apps/whk-recipe-configuration

      - name: Start Docker Compose services
        run: sudo docker-compose up -d
        working-directory: ./apps/whk-recipe-configuration

      - name: Check Docker services status
        run: sudo docker-compose ps
        working-directory: ./apps/whk-recipe-configuration

      - name: Wait for services to be ready
        run: |
          retries=60
          delay=30
          until curl -s -X POST -H "Content-Type: application/json" -d "{\"user\": \"$TEST_USERNAME\", \"password\": \"$TEST_PASSWORD\"}" http://localhost:3000/api/login; do
            echo "Waiting for service to be ready... Attempt $((61 - retries))/$60"
            echo "Current Docker container status:"
            server_id=$(sudo docker ps -qf "name=whk-mes-server-1")
            if [ -n "$server_id" ]; then
              echo "Server container logs:"
              sudo docker logs $server_id
            else
              echo "Server container not found"
            fi
            sleep $delay
            retries=$((retries - 1))
            if [ $retries -le 0 ]; then
              echo "Service did not start in time. Gathering logs..."
              sudo docker-compose logs
              echo "Final Docker container status:"
              sudo docker ps
              exit 1
            fi
          done
        working-directory: ./apps/whk-recipe-configuration
        env:
          TEST_USERNAME: ${MES_USER}
          TEST_PASSWORD: ${MES_PASSWORD}

      - name: Check Docker services status
        run: sudo docker-compose ps
        working-directory: ./apps/whk-recipe-configuration

      - name: View Docker Compose logs
        run: sudo docker-compose logs
        working-directory: ./apps/whk-recipe-configuration

      - name: Run tests
        run: npm test
        working-directory: ./apps/whk-recipe-configuration

      - name: Stop Docker Compose services
        if: always()
        run: sudo docker-compose down
        working-directory: ./apps/whk-recipe-configuration
