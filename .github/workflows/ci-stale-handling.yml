name: Close Stale Pull Requests

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight

jobs:
  close_stale_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale pull requests
        uses: actions/stale@v9.0.0
        with:
          stale-issue-message: 'This pull request has been automatically closed because it has been inactive for more than 14 days. Please reopen if you still intend to submit this pull request.'
          stale-pr-message: 'This pull request has been marked as stale because it has been inactive for more than 14 days. Please update this pull request or it will be automatically closed in 7 days.'
          days-before-stale: 60
          days-before-close: 7
          stale-pr-label: stale
          close-pr-message: 'This pull request is being closed because it has been marked as stale. If you believe this pull request is still relevant, please comment on it to prevent it from being closed.'
          close-issue-message: 'This issue is being closed because it has been marked as stale. If you believe this issue is still relevant, please comment on it to prevent it from being closed.'