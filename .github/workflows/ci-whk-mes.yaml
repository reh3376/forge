name: continuous integration - whk-recipe-routing

concurrency:
  group: whk-recipe-routing
  cancel-in-progress: false

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  continuous-integration:
    name: continuous integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Cache npm dependencies
        uses: actions/cache@v2
        with:
          path: "~/.npm"
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: install dependencies
        run: npm ci
        working-directory: ./apps/whk-recipe-configuration

      # - name: install dependencies
      #   run: npm install
      #   working-directory: ./apps/whk-recipe-configuration

      - name: Run ESLint
        run: |
          npm run lint > eslint_report.txt || (cat eslint_report.txt && exit 1)
        working-directory: ./apps/whk-recipe-configuration

      - name: Upload ESLint Report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: eslint-report
          path: ./apps/whk-recipe-configuration/eslint_report.txt

      - name: Comment PR with ESLint Results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const eslintReport = fs.readFileSync('./apps/whk-recipe-configuration/eslint_report.txt', 'utf8');
            const comment = `
            ❌ ESLint found some issues:

            \`\`\`
            ${eslintReport}
            \`\`\`

            Please fix these issues before merging.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

      - name: build
        run: npm run build
        working-directory: ./apps/whk-recipe-configuration

      - name: Run tests
        run: |
          npx jest --coverage | tee ./coverage.txt && exit ${PIPESTATUS[0]}
        working-directory: ./apps/whk-recipe-configuration
