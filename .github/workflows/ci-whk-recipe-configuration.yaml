name: continuous integration - whk-recipe-configuration

concurrency:
  group: whk-recipe-configuration
  cancel-in-progress: true

#on:
#  workflow_dispatch:
#  push:
#    branches: ["*"]
#    paths: ["./apps/whk-recipe-configuration"]

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  continuous-integration:
    name: continuous integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: cache modules
        id: cache-npm
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: setup node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install dependencies
        run: npm install
        working-directory: ./apps/whk-recipe-configuration

      - name: build
        run: npm run build
        working-directory: ./apps/whk-recipe-configuration

      - name: test
        run: npm run test-coverage
        working-directory: ./apps/whk-recipe-configuration

      - name: Run tests
        run: |
          npx jest --coverage | tee ./coverage.txt && exit ${PIPESTATUS[0]}
        working-directory: ./apps/whk-recipe-configuration

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/WHK01/whk-mes/whk-recipe-configuration
          flavor: latest=true
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=ref,event=tag,prefix=tag-
            type=raw,value=${{ github.run_id }},prefix=gh-

      - name: login to image repostiory
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v3
        with:
          context: ./apps/whk-recipe-configuration
          file: ./apps/whk-recipe-configuration/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
