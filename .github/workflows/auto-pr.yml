# Auto-open a pull request to main whenever a non-main branch is pushed and no
# open PR exists for it yet. Idempotent: reruns on later pushes are no-ops.
#
# Notes
# - Uses the built-in GITHUB_TOKEN. PRs opened with that token do NOT trigger
#   other `pull_request` workflows (GitHub limitation). If that matters, switch
#   to a fine-grained PAT stored as a repo secret and use it as GH_TOKEN.
# - The body is a placeholder; replace it with the sprint summary (repo rule:
#   detailed sprint summaries go in the PR body, not in comments).
name: Auto PR to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR if none is open for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: main
        run: |
          set -euo pipefail
          open_count=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "An open PR already exists for $BRANCH -> $BASE; nothing to do."
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BASE"; then
            echo "$BRANCH has no commits beyond $BASE; nothing to open."
            exit 0
          fi
          title=$(git log -1 --pretty=%s "$GITHUB_SHA")
          body=$(printf 'Auto-opened on push to `%s`.\n\nReplace this body with the sprint summary before review.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' "$BRANCH")
          gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body "$body"
