# CI for the Forge hub and the Forge MES module.
#
# Runs on every push to every branch (so checks attach to commits behind
# auto-opened PRs, which do not fire pull_request events when opened with the
# default token) and on pull_request from forks. The job-level `if` prevents
# running twice for same-repo PRs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-python:
    name: hub-python
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned, so SoftHSM's version cannot change under the trust root's tests without a commit
    # (FB-293 step 1a; ubuntu-latest moves to a new release on GitHub's schedule).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the archive test reads retired files from the history (FB-210)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      # Every version comes from uv.lock; --locked fails the job when pyproject.toml and the lock
      # disagree, so a dependency moves only through a committed re-lock (FB-096). uv sync creates
      # .venv with the Python setup-uv selected.
      - name: Install from the lock (dev + ot extras)
        run: uv sync --locked --extra dev --extra ot
      # SoftHSM, the software stand-in for a security device under the test stage (D-21 SF-2,
      # D-23 Q-5): the trust root's issuer signs on it through PKCS#11, as it will on a YubiKey,
      # a YubiHSM 2 or a TPM. A test tool only: it is never part of an installation. Pinned, so
      # its version moves only by a commit (with the runner above).
      - name: Install SoftHSM (test only)
        run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2=2.6.1-2.2ubuntu3
      - name: ruff check
        run: .venv/bin/ruff check . --output-format github
      - name: ruff format
        run: .venv/bin/ruff format --check .
      - name: pytest
        # -rsx: every skipped and expected-failure test is listed with its reason on each run
        # (owner, 2026-11-18: a skipped test without a visible reason is a silent gap)
        run: .venv/bin/pytest -q --no-header -p no:cacheprovider -rsx
        env:
          # Here a missing SoftHSM fails the run; on a machine without it those tests skip, saying why.
          FORGE_TEST_SOFTHSM_REQUIRED: "true"
      - name: governance gate
        # Every framework over every governed spec. A check that fails or did not run gets
        # through only by an accepted gap the owner approved (forge-core/fxts/accepted-gaps.json,
        # BACKLOG FB-266); a broken check, a stale index or a bad schema registry never does.
        run: .venv/bin/forge governance check

  hub-image:
    # The hub image is built and proved on every change that could break it, natively for each
    # architecture a plant may run (FB-231, D-24 I-1, I-3). It publishes nothing: its output is
    # a build record (the image's digest and BuildKit's provenance) for the release manifest
    # (FB-305). Like hub-go it always reports, and its steps run only when something the image
    # is built from has changed. It also starts the development stack with the image (FB-315).
    name: hub-image (${{ matrix.arch }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-files comparison needs the branch's history
      - name: anything to check?
        id: changes
        run: >
          .github/scripts/changed-paths.sh hub-image
          deploy/docker/ .dockerignore pyproject.toml uv.lock README.md
          forge-core/src/ forge-core/contract/ forge-hub/src/ forge-hub/fxts/ forge-modules/
          .github/workflows/ci.yml .github/scripts/
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: builder (BuildKit in a container, for the OCI export and its provenance)
        if: steps.changes.outputs.run == 'true'
        run: docker buildx create --name forge --driver docker-container --use
      - name: build the image
        if: steps.changes.outputs.run == 'true'
        run: >
          docker buildx build --file deploy/docker/Dockerfile.forge
          --platform linux/${{ matrix.arch }} --provenance=false --load --tag forge-hub:ci .
      - name: prove it from inside
        if: steps.changes.outputs.run == 'true'
        run: >
          docker run --rm -v "$PWD/.github/scripts/image-smoke.py:/smoke.py:ro"
          forge-hub:ci python /smoke.py
      # The development stack with this image: every service up, the init container's
      # migrations against the real pinned databases, and the hub healthy. It had never started
      # the hub (migration 004 failed on plain Postgres) and nothing ran it, so nobody saw
      # (FB-315).
      - name: the development stack starts with it
        if: steps.changes.outputs.run == 'true'
        run: |
          docker tag forge-hub:ci forge-ci-forge-hub
          docker tag forge-hub:ci forge-ci-forge-init
          compose="docker compose -p forge-ci -f deploy/docker/docker-compose.yml"
          trap '$compose ps; $compose logs --tail 80' ERR
          $compose up -d --wait postgres timescaledb neo4j redis kafka rabbitmq
          $compose run --rm --no-deps forge-init
          $compose up -d --wait --no-build --no-deps forge-hub
          $compose ps
      - name: export it with its provenance and write the build record
        if: steps.changes.outputs.run == 'true'
        run: |
          docker buildx build --file deploy/docker/Dockerfile.forge \
            --platform linux/${{ matrix.arch }} --provenance=mode=max \
            --output type=oci,dest="$RUNNER_TEMP/forge-hub.oci.tar" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          python3 .github/scripts/image-record.py "$RUNNER_TEMP/metadata.json" \
            linux/${{ matrix.arch }} "$RUNNER_TEMP/forge-hub-image-${{ matrix.arch }}.json"
      - name: keep the build record
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-hub-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/forge-hub-image-${{ matrix.arch }}.json
          if-no-files-found: error

  hub-go:
    name: hub-go
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-core/src/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-files comparison needs the branch's history
      # The job is a required check on main, so it always reports. Its steps run only when
      # the push touches what the Go suite checks (BACKLOG FB-173, owner 2026-11-19).
      - name: anything to check?
        id: changes
        working-directory: ${{ github.workspace }}
        run: >
          .github/scripts/changed-paths.sh hub-go
          forge-core/src/go/ forge-core/contract/proto/ .github/workflows/ci.yml .github/scripts/
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: forge-core/src/go/go.mod
          cache-dependency-path: forge-core/src/go/go.sum
      - run: go build ./...
        if: steps.changes.outputs.run == 'true'
      - name: gofmt
        if: steps.changes.outputs.run == 'true'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt -l:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
        if: steps.changes.outputs.run == 'true'
      - run: go test ./... -count=1
        if: steps.changes.outputs.run == 'true'

  mes-module:
    name: mes-module
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-modules/forge-mes/bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-files comparison needs the branch's history
      # The job is a required check on main, so it always reports. Its steps run only when
      # the push touches the interim MES bridge, or the hub's proto files and forge-mes
      # manifest that the bridge keeps copies of (BACKLOG FB-173, owner 2026-11-19).
      - name: anything to check?
        id: changes
        working-directory: ${{ github.workspace }}
        run: >
          .github/scripts/changed-paths.sh mes-module
          "forge-modules/forge-mes/bridge/" forge-core/contract/proto/ forge-modules/forge-mes/src/python/forge_mes/manifest.json
          .github/workflows/ci.yml .github/scripts/
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forge-modules/forge-mes/bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.changes.outputs.run == 'true'
      - name: shared build
        if: steps.changes.outputs.run == 'true'
        run: npm run build:shared
      - name: backend prisma generate
        if: steps.changes.outputs.run == 'true'
        run: npx prisma generate
        working-directory: forge-modules/forge-mes/bridge/backend
      - name: backend type-check
        if: steps.changes.outputs.run == 'true'
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: forge-modules/forge-mes/bridge/backend
      - name: backend tests of the link to the hub
        if: steps.changes.outputs.run == 'true'
        # Blocking. Only the bridge's link to the hub (src/forge): it is the one module outside
        # Python that speaks the hub contract, and a change to the contract can break it. The
        # old application's own business tests are not run: forge-mes is to be written in Go
        # (D-3), so they test code that will not carry over (the owner, 2026-11-23; FB-036).
        # No --passWithNoTests: a path that matches no test fails the step.
        run: npx jest --ci src/forge
        working-directory: forge-modules/forge-mes/bridge/backend
      - name: frontend type-check
        if: steps.changes.outputs.run == 'true'
        # Blocking since BACKLOG FB-028 (2026-11-17): the interim frontend type-checks clean
        # under its strict flags, and a new type error fails the job.
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: forge-modules/forge-mes/bridge/frontend

  secrets-scan:
    name: secrets-scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks on the pushed commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
