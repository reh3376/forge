# CI for the Forge hub and the Forge MES module.
#
# Runs on every push to every branch (so checks attach to commits behind
# auto-opened PRs, which do not fire pull_request events when opened with the
# default token) and on pull_request from forks. The job-level `if` prevents
# running twice for same-repo PRs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-python:
    name: hub-python
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Create .venv explicitly (setup-uv v5 pre-created it, v6 does not); --clear makes it idempotent.
      - name: Install (dev + ot extras)
        run: |
          uv venv --clear .venv
          uv pip install --python .venv/bin/python -e ".[dev,ot]"
      - name: ruff (advisory until BACKLOG FB-022 is cleared)
        run: .venv/bin/ruff check . --output-format github
        continue-on-error: true
      - name: pytest
        run: .venv/bin/pytest tests -q --no-header -p no:cacheprovider

  hub-go:
    name: hub-go
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  mes-module:
    name: mes-module
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/Forge MES
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/Forge MES/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: shared build
        run: npm run build:shared
      - name: backend prisma generate
        run: npx prisma generate
        working-directory: modules/Forge MES/backend
      - name: backend type-check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: modules/Forge MES/backend
      - name: backend unit tests (advisory until BACKLOG FB-036 is verified)
        run: npx jest --ci --passWithNoTests
        working-directory: modules/Forge MES/backend
        continue-on-error: true
      - name: frontend type-check (advisory until BACKLOG FB-028 is fixed)
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: modules/Forge MES/frontend
        continue-on-error: true

  secrets-scan:
    name: secrets-scan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks on the pushed commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
