name: Deploy to Production

on:
  push:
    tags:
      - "v**"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HOME: C:\Windows\ServiceProfiles\NetworkService

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          git_config: |
            core.autocrlf=false

      - name: Convert deploy.sh to Unix Line Endings Without BOM
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          $deployScriptPath = 'deploy.sh'
          $content = Get-Content $deployScriptPath -Raw
          $content = $content -replace "`r`n", "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($False)
          [System.IO.File]::WriteAllText($deployScriptPath, $content, $utf8NoBom)

      - name: Set up environment variables
        run: |
          echo "Setting up environment variables"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Decrypt the .env file from dotenv-vault
        run: |
          echo "Decrypting .env file"
          npx dotenv-vault@latest decrypt ${{ secrets.DOTENV_KEY }} > .env
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        env:
          DOTENV_KEY: ${{ secrets.DOTENV_KEY }}

      - name: Verify .env File Exists
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          if (Test-Path .env) {
            Write-Output ".env file exists."
          } else {
            Write-Error ".env file is missing."
            exit 1
          }

      - name: Archive Project Files Including .env
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          # Compress all regular and hidden files into deploy.zip
          Compress-Archive -Path *,'.[^.]*' -DestinationPath deploy.zip -Force

          # Optional: Verify that the .env file is included in the archive
          try {
            Expand-Archive -Path deploy.zip -DestinationPath temp_extract -Force
            if (Test-Path temp_extract\.env) {
              Write-Output ".env is included in the archive."
            } else {
              Throw ".env is NOT included in the archive."
            }
          } catch {
            Write-Error "Failed to verify .env in the archive: $_"
            Remove-Item -Recurse -Force temp_extract -ErrorAction SilentlyContinue
            exit 1
          }

          # Clean up the temporary extraction directory
          Remove-Item -Recurse -Force temp_extract -ErrorAction SilentlyContinue

      - name: Copy Archive to Remote Server
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          scp -i ~\.ssh\ldkrvm01 deploy.zip ${{ secrets.SERVER_USERNAME }}${{ secrets.SERVER_HOST }}:/usr/local/src/repos/whk-mes-deploy
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Unzip Archive on Remote Server
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy && unzip -o deploy.zip && rm deploy.zip && ls -la"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy && chmod +x deploy.sh && ./deploy.sh"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Run Prisma migrations on remote server
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy/apps/whk-recipe-configuration && npx prisma migrate deploy"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
