name: Deploy to Production

on:
  push:
    tags:
      - "v**"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HOME: C:\Windows\ServiceProfiles\NetworkService

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          git_config: |
            core.autocrlf=false

      - name: Convert deploy.sh to Unix Line Endings Without BOM
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          $deployScriptPath = 'deploy.sh'
          $content = Get-Content $deployScriptPath -Raw
          $content = $content -replace "`r`n", "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($False)
          [System.IO.File]::WriteAllText($deployScriptPath, $content, $utf8NoBom)

      - name: Set up environment variables
        run: |
          echo "Setting up environment variables"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Decrypt the .env file from dotenv-vault
        run: |
          echo "Decrypting .env file"
          npx dotenv-vault@latest decrypt ${{ secrets.DOTENV_KEY }} > .env
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        env:
          DOTENV_KEY: ${{ secrets.DOTENV_KEY }}

      - name: Print .env file
        run: cat C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration\.env

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "echo Connected"

      - name: Create directory on remote server
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "mkdir -p /usr/local/src/repos/whk-mes-deploy"

      - name: Archive project files
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: powershell
        run: |
          Compress-Archive -Path * -Path .[^.]* -DestinationPath deploy.zip -Force

      - name: Copy archive to remote server
        working-directory: C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration
        shell: bash
        run: |
          scp -i ~/.ssh/ldkrvm01 deploy.zip ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/usr/local/src/repos/whk-mes-deploy

      - name: Unzip archive on remote server
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy && unzip deploy.zip && rm deploy.zip"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy && chmod +x deploy.sh && ./deploy.sh"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Run Prisma migrations on remote server
        run: |
          ssh -i ~/.ssh/ldkrvm01 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "cd /usr/local/src/repos/whk-mes-deploy/apps/whk-recipe-configuration && npx prisma migrate deploy"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
