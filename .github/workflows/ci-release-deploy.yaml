      - name: Copy Project Files to Remote Server
        shell: powershell
        run: |
          scp -r -i "~\.ssh\ldkrvm01" C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration\* ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/usr/local/src/repos/whk-mes-deploy
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Copy .env to Remote Server
        shell: powershell
        run: |
          scp -v -i "~\.ssh\ldkrvm01" C:\actions-runner\_work\whk-mes\whk-mes\apps\whk-recipe-configuration\.env ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/usr/local/src/repos/whk-mes-deploy
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Verify Files on Remote Server
        run: |
          ssh -o StrictHostKeyChecking=no -i "~\.ssh\ldkrvm01" ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "ls -la /usr/local/src/repos/whk-mes-deploy"
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Set Permissions for .env
        run: |
          ssh -o StrictHostKeyChecking=no -i "~\.ssh\ldkrvm01" ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "chmod 600 /usr/local/src/repos/whk-mes-deploy/.env"
        env:
