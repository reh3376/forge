_format_version: "3.0"
consumers:
  - basicauth_credentials:
      - password: 8f6970872f9cb8eff4a8d3324954b077c3b0c764
        username: admin
    tags:
      - users
    username: admin
plugins:
  - config:
      anonymous: null
      hide_credentials: false
      realm: service
    enabled: false
    instance_name: basic-auth-plugin
    name: basic-auth
    protocols:
      - grpc
      - grpcs
      - http
      - https
  - config:
      cache_control: false
      cache_ttl: 300
      content_type:
        - text/plain
        - application/json
      ignore_uri_case: false
      memory:
        dictionary_name: kong_db_cache
      request_method:
        - GET
        - HEAD
      response_code:
        - 200
        - 301
        - 404
      response_headers:
        X-Cache-Key: true
        X-Cache-Status: true
        age: true
      storage_ttl: null
      strategy: memory
      vary_headers: null
      vary_query_params: null
    enabled: true
    instance_name: proxy-cache-plugin
    name: proxy-cache
    protocols:
      - grpc
      - grpcs
      - http
      - https
services:
  - connect_timeout: 60000
    enabled: true
    host: host.docker.internal
    name: orders
    port: 3001
    protocol: http
    read_timeout: 60000
    retries: 5
    routes:
      - https_redirect_status_code: 426
        methods:
          - GET
          - PUT
          - POST
          - PATCH
          - DELETE
        name: orders
        path_handling: v0
        paths:
          - /orders
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
        tags:
          - mes
          - graphql
          - rest
    tags:
      - mes
