# Mosquitto MQTT Broker Configuration for WHK Development
# --------------------------------------------------------

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Default listener (MQTT protocol)
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Allow anonymous connections (dev only - DO NOT use in production)
allow_anonymous true

# Max connections
max_connections -1

# Message settings
max_inflight_messages 20
max_queued_messages 1000

# Keep alive
max_keepalive 120
