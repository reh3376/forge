[project]
name = "forge-platform"
version = "0.1.0"
description = "Manufacturing Decision Infrastructure Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "reh3376" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "pydantic>=2.11.0",  # validate_by_name / serialize_by_alias (DataProduct.schema alias, FB-086)
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "neo4j>=5.27.0",
    "confluent-kafka>=2.6.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "jsonschema>=4.23.0",
    "grpcio>=1.60.0",
    "protobuf>=5.27.0",
    "aio-pika>=9.0.0",
    "minio>=7.2.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
ot = [
    "asyncua==2.1.0",  # exact pin: one tested version on 3.12 (CI) and 3.14 (local); 2.x is the first line with 3.14 support
    "aiomqtt>=2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff==0.17.6",  # exact pin: the formatter must agree between the local venv and CI
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "grpcio-tools>=1.60.0",
]

[project.scripts]
forge = "forge_hub.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "forge-core/src/python/forge_core",
    "forge-hub/src/python/forge_hub",
    "forge-modules/forge-cmms/src/python/forge_cmms",
    "forge-modules/forge-historian/src/python/forge_historian",
    "forge-modules/forge-ims/src/python/forge_ims",
    "forge-modules/forge-integ-erp-netsuite/src/python/forge_integ_erp_netsuite",
    "forge-modules/forge-mes/src/python/forge_mes",
    "forge-modules/forge-nms/src/python/forge_nms",
    "forge-modules/forge-ot/src/python/forge_ot",
    "forge-modules/forge-scanner/src/python/forge_scanner",
    "forge-modules/forge-wms/src/python/forge_wms",
]

# forge-core's contract (proto files, framework schemas, governed lists) is language-neutral and
# lives outside the Python package; a built package carries it as forge_core/_contract
# (forge_core.contract finds it in either place).
[tool.hatch.build.targets.wheel.force-include]
"forge-core/contract" = "forge_core/_contract"
# The hub's own governed files, likewise outside its package (forge_hub.fxts finds them).
"forge-hub/fxts" = "forge_hub/_fxts"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "forge-core/src/python",
    "forge-hub/src/python",
    "forge-modules/forge-cmms/src/python",
    "forge-modules/forge-historian/src/python",
    "forge-modules/forge-ims/src/python",
    "forge-modules/forge-integ-erp-netsuite/src/python",
    "forge-modules/forge-mes/src/python",
    "forge-modules/forge-nms/src/python",
    "forge-modules/forge-ot/src/python",
    "forge-modules/forge-scanner/src/python",
    "forge-modules/forge-wms/src/python",
    "tests",
    "forge-core/tests",
    "forge-hub/tests",
]
# Applies the excludes even when paths are passed explicitly (pre-commit, `git ls-files | xargs`).
force-exclude = true
extend-exclude = [
    "forge-core/src/python/forge_core/proto_gen/forge/v1/*_pb2*.py",  # generated by grpcio-tools; regenerate, never edit
    ".claude",                                 # MDEMG-generated hooks, untracked
    "*.md",                                    # ruff >= 0.17 formats Markdown code blocks; docs stay out until opted in
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "DTZ",  # flake8-datetimez: no naive datetimes (one clock, FB-014)
    "SIM",  # simplify
    "TCH",  # type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at class creation, so their imports must stay at runtime.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "forge_core.clock.OneClockModel",  # BaseModel with the one-clock validator (FB-014)
]

[tool.ruff.lint.isort]
known-first-party = [
    "forge_core",
    "forge_hub",
    "forge_cmms",
    "forge_historian",
    "forge_ims",
    "forge_integ_erp_netsuite",
    "forge_mes",
    "forge_nms",
    "forge_ot",
    "forge_scanner",
    "forge_wms",
]

[tool.pytest.ini_options]
# Three trees: what spans layers and the modules' tests in tests/, forge-core's own in
# forge-core/tests and the hub's in forge-hub/tests (D-17 §10.3). Two folders named tests cannot both be the package "tests",
# so test files are imported by path (importlib mode) and the repository root is on the
# import path for the helpers under tests/.
testpaths = ["tests", "forge-core/tests", "forge-hub/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
