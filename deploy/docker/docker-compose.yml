# Forge Platform — F04 Development Stack
# Usage: docker compose -f deploy/docker/docker-compose.yml up -d
#
# Tier 1: Infrastructure (PostgreSQL, TimescaleDB, Neo4j, Redis, Kafka, the object store)
# Tier 2: Init container (schema migrations, runs once then exits)
# Tier 3: Application (Hub API with gRPC + REST, Curation sub-mount)
#
# Ports:
#   8000  — Hub REST API
#   50051 — Hub gRPC (spoke transport)
#   5432  — PostgreSQL
#   5433  — TimescaleDB
#   7474  — Neo4j Browser
#   7687  — Neo4j Bolt
#   6379  — Redis
#   9092  — Kafka
#   9000  — the object store (S3)

services:

  # ==================================================================
  # Tier 1: Infrastructure
  # ==================================================================

  postgres:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forge-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16@sha256:5d7a2f9d9d593315368338aa6054fda37d7707b4a12a912e30dcb7523385e2b4
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-forge_ts}
      POSTGRES_USER: ${TIMESCALE_USER:-forge}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - forge-ts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-forge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community@sha256:c5fd91e41d44858ea678813fd53f8e60602e771a7656c502385247ffbcb0aec0
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      # APOC core ships inside the image (labs/apoc-*-core.jar) and is copied, not downloaded:
      # proved by starting it with no network (FB-312)
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - forge-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - forge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    # Apache's own image: bitnami/kafka is no longer published (not found, 2026-11-26; FB-312).
    # One node in KRaft mode, broker and controller together, as before.
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - forge-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-forge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - forge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  object-store:
    # Forge depends on the S3 protocol and names its object store by role; RustFS is the store
    # Forge ships (FB-314, the owner 2026-11-27). Any store that passes
    # `python -m forge_hub.storage.object_store_check` can stand in for it.
    image: rustfs/rustfs:1.0.7@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-forge}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-changeme}
      # Encryption at rest needs a key (base64 of 32 bytes). Without one the store refuses a
      # request to encrypt and says so, and the capability check reports encryption as not met.
      RUSTFS_SSE_S3_MASTER_KEY: ${OBJECT_STORE_ENCRYPTION_KEY:-}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - forge-object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================================================================
  # Tier 2: Init Container (runs once, then exits)
  # ==================================================================

  forge-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.forge
    # The entrypoint is built into the image (FB-312); rebuild after changing it
    entrypoint: ["/bin/bash", "/app/deploy/docker/init-entrypoint.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: ${TIMESCALE_DB:-forge_ts}
      TIMESCALE_USER: ${TIMESCALE_USER:-forge}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HOST: neo4j
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-forge}:${RABBITMQ_PASS:-changeme}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ==================================================================
  # Tier 3: Application Services
  # ==================================================================

  forge-hub:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.forge
    ports:
      - "${FORGE_API_PORT:-8000}:8000"
      - "${FORGE_GRPC_PORT:-50051}:50051"
    environment:
      # Storage — Docker service names, not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: ${TIMESCALE_DB:-forge_ts}
      TIMESCALE_USER: ${TIMESCALE_USER:-forge}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: object-store:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-forge}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-forge}:${RABBITMQ_PASS:-changeme}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      # API
      FORGE_API_HOST: "0.0.0.0"
      FORGE_API_PORT: "8000"
      FORGE_GRPC_PORT: "50051"
      FORGE_GRPC_ENABLED: "true"
      # TLS for the gRPC listener (FB-072): mount PEM files and set these; add _CA for mTLS.
      # FORGE_GRPC_TLS_CERT: /run/secrets/forge-hub.pem
      # FORGE_GRPC_TLS_KEY: /run/secrets/forge-hub.key
      # FORGE_GRPC_TLS_CA: /run/secrets/forge-ca.pem
      # FORGE_GRPC_REQUIRE_TLS: "true"
      # Features
      FORGE_AUTH_ENABLED: "false"
      FORGE_JWT_SECRET: "${FORGE_JWT_SECRET:-forge-dev-secret-do-not-use-in-prod}"
      FORGE_JWT_ALGORITHM: "${FORGE_JWT_ALGORITHM:-HS256}"
      FORGE_JWT_ISSUER: "${FORGE_JWT_ISSUER:-forge-dev-hub}"
      FORGE_JWT_AUDIENCE: "${FORGE_JWT_AUDIENCE:-forge-hub}"
      FORGE_API_KEYS: "${FORGE_API_KEYS:-}"
      FORGE_RATE_LIMIT_REDIS: "false"
      FORGE_OTEL_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      forge-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  forge-pg-data:
  forge-ts-data:
  forge-neo4j-data:
  forge-redis-data:
  forge-kafka-data:
  forge-rabbitmq-data:
  forge-object-store-data:
